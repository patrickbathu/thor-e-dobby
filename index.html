<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thor e Dobby</title>
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thor e Dobby">
<meta name="theme-color" content="#F4F5FA">
<style>
:root{--bg:#F4F5FA;--card:#fff;--ink:#191C28;--muted:#5E6478;--accent:#4E62A6;--bad:#C9483A;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;
 padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--card);border-radius:24px;padding:28px 22px;width:100%;max-width:360px;box-shadow:0 1px 2px rgba(25,28,40,.06),0 10px 30px rgba(25,28,40,.08);text-align:center}
.pair{display:flex;justify-content:center;margin-bottom:14px}
.pair img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 3px var(--ring)}
.pair img+img{margin-left:-14px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
input[type=password]{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid #DEE1EB;background:#F7F8FC;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label.rem{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0 16px;font-size:14px;color:var(--muted)}
button{width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="pair"><img src="avatars/thor.jpg" alt="" style="--ring:#5A73B5"><img src="avatars/dobby.jpg" alt="" style="--ring:#E6BE28"></div>
  <h1>Thor e Dobby</h1>
  <p>Digite a senha para abrir o diário de saúde.</p>
  <input type="text" name="username" value="thor-e-dobby" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Senha" required>
  <label class="rem"><input type="checkbox" id="rem" checked> Lembrar neste aparelho</label>
  <button id="go">Abrir</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K="td-key-"+P.salt;
async function unlock(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(P.salt),iterations:P.iter},base,256));
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem(K)}catch(e){}
  if(saved){let html=null;try{html=await unlock(b64(saved))}catch(e){try{localStorage.removeItem(K)}catch(_){}}if(html)show(html)}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("go"),err=document.getElementById("err");
  btn.disabled=true;btn.textContent="Abrindo…";err.textContent="";
  try{
    const raw=await derive(document.getElementById("pw").value);
    const html=await unlock(raw);
    if(document.getElementById("rem").checked){try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)))}catch(_){}}
    show(html);
  }catch(x){err.textContent="Senha incorreta. Tente de novo.";btn.disabled=false;btn.textContent="Abrir"}
});
</script>
